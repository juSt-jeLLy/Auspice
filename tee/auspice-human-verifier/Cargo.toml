[package]
name = "auspice-human-verifier"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "auspice_human_verifier"
path = "src/lib.rs"

[[bin]]
name = "auspice-human-verifier"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(target_os = "wasi")'.dependencies]
wasi-http-client = "0.2"
