[package]
name = "auspice-coin"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
borsh = "1"
near-sdk = "5.30"
near-contract-standards = "5.30"
primitive-types = "0.13"

[dev-dependencies]
ed25519-dalek = "2"
near-sdk = { version = "5.30", features = ["unit-testing"] }
